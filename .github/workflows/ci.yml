name: CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "dashboard/**"
      - "ADWs/**"
      - "config/**"
      - "tests/**"
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "evonexus.stack.yml"
      - "start-dashboard.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "dashboard/**"
      - "ADWs/**"
      - "config/**"
      - "tests/**"
      - "Dockerfile*"
      - "docker-compose*.yml"
      - "evonexus.stack.yml"
      - "start-dashboard.sh"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync Python dependencies
        run: uv sync --frozen --dev

      - name: Run backend tests
        run: >-
          uv run python -m pytest -q
          tests/backend
          tests/db
          tests/heartbeats
          tests/test_deployment_images.py
          ADWs/test_hermes_integration.py
          ADWs/test_runtime_policy.py

      - name: Validate deployment manifests
        env:
          EVONEXUS_IMAGE_TAG: sha-ci
        run: |
          bash -n start-dashboard.sh
          docker compose -f docker-compose.hub.yml config >/dev/null
          docker compose -f docker-compose.proxy.yml config >/dev/null
          docker stack config -c evonexus.stack.yml >/dev/null

  terminal-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/terminal-server/package-lock.json

      - name: Install terminal server dependencies
        working-directory: dashboard/terminal-server
        run: npm ci

      - name: Run terminal server tests
        working-directory: dashboard/terminal-server
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run frontend tests
        working-directory: dashboard
        run: npm run test --workspace frontend

      - name: Build frontend
        working-directory: dashboard
        run: npm run build --workspace frontend
